<style>

*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;letter-spacing:1px;font-size:18px}
.logo b{color:var(--gold)}
.sub{font-size:12px;color:#C9CBD0}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--dark2);padding:6px 8px;position:sticky;top:52px;z-index:19}
nav button{background:transparent;border:0;color:#D8DADF;font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:var(--dark)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #CFCFCA;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;background:var(--gold);color:var(--dark)}
.btn.dark{background:var(--dark);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.red{background:#fff;border:1px solid #E8B4AE;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--txt)}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--dark);color:#fff;font-weight:600;padding:7px 6px;text-align:right}
td{border-bottom:1px solid var(--line);padding:6px}
tr.grp td{background:#FFF6DC;font-weight:700}
tr.tot td{font-weight:800;background:#F1F1EE}
.tw{overflow-x:auto}
td input{padding:5px 6px;font-size:13px;min-width:60px}
.num{direction:ltr;text-align:left;white-space:nowrap}
.win{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.win .t{font-weight:700}
.win .d{font-size:12.5px;color:var(--mut)}
.price{font-weight:800;color:var(--dark);font-size:16px}
.big{font-size:22px;font-weight:800}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{background:#FAFAF8;border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:17px}
details summary{cursor:pointer;font-weight:700;color:var(--mut);font-size:13px;padding:6px 0}

.modal.on{display:flex}
.modal .card{width:100%;max-width:560px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:60}
.pill{display:inline-block;background:#FFF1C7;color:#7A5A00;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
#print{display:none}
/* ---- print docs ---- */
.doc{font-family:Cairo,Tahoma,sans-serif;color:#111;padding:6mm}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
.doc .brand{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--dark)}
.doc .brand b{color:var(--gold)}
.doc .meta{font-size:12px;text-align:left;line-height:1.7}

.doc th{background:#3A3D44}

/* أطوال القطع: W عرض الشباك، H ارتفاع الجزء الجرار، HT الارتفاع الكلي، F ارتفاع الثابت */
const LEN_OPTS={'W':'العرض','W/2':'نص العرض','W/3':'ثلث العرض','W+10':'العرض + 10 سم','H':'ارتفاع الجرار','HT+10':'الارتفاع الكلي + 10 سم','F':'ارتفاع الثابت','SAS':'السؤاس (ارتفاع الثابت أو العرض)'};
const GROUPS={base:'الجزء الجرار',mesh:'ضلف السلك',track:'مجرى سلك إضافي',fix:'الجزء الثابت FIX'};
function R(g,p,len,n){return {g,p,len,n}}
const DEF_RULES={
 2:[R('base','p1','W',2),R('base','p1','H',2),R('base','p3','H',2),R('base','p4','W',2),R('base','p5','H',1),R('base','p6','H',1),R('base','p7','W+10',2),R('base','p7','HT+10',2),
    R('mesh','p11','W/2',2),R('mesh','p11','H',1),R('mesh','p12','H',1),R('mesh','p13','H',1),
    R('track','p10','W',2),R('track','p10','H',2)],
 3:[R('base','p2','W',2),R('base','p2','H',2),R('base','p3','H',2),R('base','p4','W',2),R('base','p5','H',2),R('base','p6','H',2),R('base','p7','W+10',2),R('base','p7','HT+10',2),
    R('mesh','p10','W',2),R('mesh','p11','H',4),R('mesh','p11','W/3',2)],
 4:[R('base','p1','W',2),R('base','p1','H',2),R('base','p3','H',2),R('base','p4','W',2),R('base','p5','H',2),R('base','p6','H',2),R('base','p7','W+10',2),R('base','p7','HT+10',2),R('base','p8','H',1),R('base','p9','H',1),
    R('mesh','p11','W/2',4),R('mesh','p11','H',2),R('mesh','p12','H',2),R('mesh','p13','H',2),
    R('track','p10','W',2),R('track','p10','H',2)],
 fix:[R('fix','p14','W',2),R('fix','p14','F',2),R('fix','p15','W',2),R('fix','p15','F',2),R('fix','p16','SAS',1)]
};
/* كميات الإكسسوار: n = عدد ثابت | kw,kh = متر طولي (kw×العرض + kh×الارتفاع) | kwh = متر مربع | perim = محيط حلق الفيكس */
function A(g,a,o){return Object.assign({g,a},typeof o==='number'?{n:o}:o)}
const DEF_ACC_RULES={
 2:[A('base','a1',8),A('base','a2',4),A('base','a3',1),A('base','a4',2),A('base','a5',1),A('base','a6',1),A('base','a7',2),A('base','a8',{kw:3,kh:0}),A('base','a9',{kw:4,kh:8}),A('base','a10',{kw:0,kh:2}),A('base','a11',{kw:3,kh:6}),A('base','a12',4),A('base','a16',1),A('base','a17',1),A('base','a18',2),A('base','a19',1),A('base','a20',1),A('base','a23',1),
    A('mesh','a13',4),A('mesh','a14',2),A('mesh','a15',2),A('mesh','a24',{kwh:0.5})],
 3:[A('base','a1',8),A('base','a2',6),A('base','a3',2),A('base','a4',2),A('base','a5',2),A('base','a6',2),A('base','a7',4),A('base','a8',{kw:3,kh:0}),A('base','a9',{kw:4,kh:8}),A('base','a10',{kw:0,kh:4}),A('base','a11',{kw:5,kh:10}),A('base','a12',4),A('base','a16',1),A('base','a17',1),A('base','a18',2),A('base','a19',2),A('base','a20',2),A('base','a23',1),
    A('mesh','a13',16),A('mesh','a14',4),A('mesh','a15',4),A('mesh','a24',{kwh:0.6667})],
 4:[A('base','a1',8),A('base','a2',8),A('base','a3',3),A('base','a4',2),A('base','a5',2),A('base','a6',2),A('base','a7',4),A('base','a8',{kw:3,kh:0}),A('base','a9',{kw:4,kh:16}),A('base','a10',{kw:0,kh:8}),A('base','a11',{kw:3,kh:6}),A('base','a12',4),A('base','a16',2),A('base','a17',2),A('base','a18',4),A('base','a19',2),A('base','a20',2),A('base','a21',1),A('base','a22',1),A('base','a23',1),
    A('mesh','a13',8),A('mesh','a14',4),A('mesh','a15',4),A('mesh','a24',{kwh:0.5})],
 fix:[A('fix','a25',4),A('fix','a26',{perim:1}),A('fix','a27',{perim:1})]
};
const DEF_SETTINGS={kgPrice:395,paintRate:50,laborPct:60,waste:5,accWaste:5,glassWaste:5,glassPrice:1550,glassName:'',barLen:600,
 company:{name:'ULTRA SYSTEM',tagline:'ألومنيوم – شبابيك وأبواب',phone:'',address:'',terms:'الأسعار سارية لمدة 7 أيام من تاريخ العرض.\nيتم دفع 50% مقدم عند التعاقد والباقي عند التركيب.'}};

/* =================== التخزين =================== */
const KEY='ultra14600_v1';
let DB;
function clone(o){return JSON.parse(JSON.stringify(o))}
function freshCatalog(){return {profiles:clone(DEF_PROFILES),acc:clone(DEF_ACC),rules:clone(DEF_RULES),accRules:clone(DEF_ACC_RULES)}}
function load(){
  try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DB=null}
  if(!DB){DB={settings:clone(DEF_SETTINGS),catalog:freshCatalog(),projects:[],cur:null,seq:1}}
  DB.settings=Object.assign(clone(DEF_SETTINGS),DB.settings||{});
  if(!DB.cur) DB.cur=newProject();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('تعذر الحفظ على هذا الجهاز')}}
function uid(){return Math.random().toString(36).slice(2,9)}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function newProject(){
  const s=DB.settings;
  return {id:uid(),no:'',client:'',phone:'',address:'',date:today(),color:'',notes:'',

}

/* =================== الحساب =================== */
const r2=x=>Math.round(x*100)/100;
const f2=x=>(isFinite(x)?x:0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const f0=x=>Math.round(x||0).toLocaleString('en-US');
function calcWindow(win,P){
  const cat=P.cat, W=+win.w*100||0, HT=+win.h*100||0;
  const F=win.fix?(+win.fixH*100||0):0, H=Math.max(HT-F,0);
  const groups={base:1,mesh:!!win.mesh,track:!!win.track,fix:!!win.fix};
  const L={'W':W,'W/2':W/2,'W/3':W/3,'W+10':W+10,'H':H,'HT+10':HT+10,'F':F,'SAS':win.sasDir==='W'?W:F};
  const prof=id=>cat.profiles.find(p=>p.id===id)||{name:'?',code:'',w:0};
  const accOf=id=>cat.acc.find(a=>a.id===id)||{name:'?',code:'',price:0,unit:'pc'};
  const rules=(cat.rules[win.leaves]||[]).concat(win.fix?cat.rules.fix:[]);
  const cuts=[];let raw=0;
  rules.forEach(r=>{ if(!groups[r.g]||!(+r.n)) return; const p=prof(r.p); const len=r2(L[r.len]||0); const tot=len*r.n; const kg=p.w*tot/100; raw+=kg;
    cuts.push({g:r.g,pid:r.p,name:p.name,code:p.code,n:+r.n,len,tot,w:p.w,kg}); });
  const weight=raw*(1+(+P.waste||0)/100);
  const aRules=(cat.accRules[win.leaves]||[]).concat(win.fix?cat.accRules.fix:[]);
  const accs=[];let accRaw=0; const Wm=W/100,Hm=H/100,Fm=F/100;
  aRules.forEach(r=>{ if(!groups[r.g]) return; const a=accOf(r.a); let q;
    if(r.n!=null) q=+r.n; else if(r.kwh!=null) q=r.kwh*Wm*Hm; else if(r.perim) q=r.perim*(2*Wm+2*Fm); else q=(+r.kw||0)*Wm+(+r.kh||0)*Hm;
    if(!q) return; const cost=q*a.price; accRaw+=cost; accs.push({g:r.g,name:a.name,code:a.code,unit:a.unit,q,price:a.price,cost}); });
  const accCost=accRaw*(1+(+P.accWaste||0)/100);
  const area=W*HT/10000;
  const alu=weight*(+P.kgPrice||0);
  const glass=area*(+P.glassPrice||0)*(1+(+P.glassWaste||0)/100);
  const paint=weight*(+P.paintRate||0);
  const extra=+win.extra||0;
  const sub=alu+accCost+glass+paint+extra;
  const labor=sub*(+P.laborPct||0)/100;
  const unit=sub+labor, qty=+win.qty||1;
  return {W,H,HT,F,cuts,raw,weight,accs,accRaw,accCost,area,alu,glass,paint,extra,sub,labor,unit,qty,total:unit*qty,perM:area?unit/area:0};
}
function calcProject(P){
  const res=P.windows.map(w=>({win:w,c:calcWindow(w,P)}));
  const sum=res.reduce((s,x)=>s+x.c.total,0);
  const disc=+P.discount||0;
  return {res,sum,disc,net:sum-disc,area:res.reduce((s,x)=>s+x.c.area*x.c.qty,0),weight:res.reduce((s,x)=>s+x.c.weight*x.c.qty,0)};
}
function winTitle(w,i){return (w.name||('شباك '+(i+1)))}
function winDesc(w){return `جرار ${w.leaves} ضلفة – ${f2(+w.w)} × ${f2(+w.h)} م`+(w.mesh?' – سلك':'')+(w.track?' – مجرى سلك إضافي':'')+(w.fix?` – ثابت ${f2(+w.fixH)} م`:'')}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;VIEW=b.dataset.v;render()});
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  const v={proj:vProj,calc:vCalc,cut:vCut,quote:vQuote,saved:vSaved,settings:vSettings}[VIEW];
  $('#app').innerHTML=v(); window.scrollTo(0,0);
}
function setP(k,v){DB.cur[k]=v;save()}
function inp(label,key,type='text',extra=''){const v=DB.cur[key];return `<div><label>${label}</label><input type="${type}" value="${esc(v)}" ${extra} oninput="setP('${key}',${type==='number'?'+this.value':'this.value'});${type==='number'?'refreshTotals()':''}"></div>`}

  const P=DB.cur, C=calcProject(P);
  return `
  <div class="card"><h3>بيانات المشروع / العميل</h3>
   <div class="grid">${inp('اسم العميل','client')}${inp('التليفون','phone','tel')}${inp('العنوان','address')}${inp('رقم العرض','no')}${inp('التاريخ','date','date')}${inp('اللون','color')}</div>
  </div>
  <div class="card"><h3>أسعار الشغلانة دي</h3>
   <div class="grid">
    ${inp('سعر كيلو الألومنيوم','kgPrice','number','step="any"')}
    ${inp('نوع / مسمى الزجاج','glassName','text','placeholder="مثال: 6 مم سيكوريت فاميه"')}
    ${inp('سعر متر الزجاج','glassPrice','number','step="any"')}
    ${inp('المصنعية %','laborPct','number','step="any"')}
    ${inp('سعر الدهان / كيلو','paintRate','number','step="any"')}
    ${inp('خصم (جنيه)','discount','number','step="any"')}
   </div>
   <p class="hint">أسعار الإكسسوار وأوزان القطاعات بتتاخد من قائمة الأسعار. لو غيّرت القائمة اضغط: <button class="btn ghost sm" onclick="refreshCat()">تحديث المشروع بأسعار القائمة الحالية</button></p>
  </div>
  <div class="card"><h3>الشبابيك <span class="pill">${P.windows.length}</span></h3>
   ${P.windows.map((w,i)=>{const c=calcWindow(w,P);return `<div class="win"><div><div class="t">${esc(winTitle(w,i))} ${w.qty>1?`<span class="pill">× ${w.qty}</span>`:''}</div><div class="d">${winDesc(w)}</div></div>
     <div class="row"><span class="price">${f0(c.total)} ج</span><button class="btn ghost sm" onclick="editWin(${i})">تعديل</button><button class="btn ghost sm" onclick="dupWin(${i})">تكرار</button><button class="btn red sm" onclick="delWin(${i})">حذف</button></div></div>`}).join('')||'<p class="hint">لسه مفيش شبابيك. اضغط "إضافة شباك".</p>'}
   <div class="row" style="margin-top:8px"><button class="btn" onclick="editWin(-1)">+ إضافة شباك</button></div>
  </div>
  <div class="card" id="totals">${totalsHtml(C)}</div>
  <div class="row"><button class="btn dark" onclick="saveProject()">💾 حفظ المشروع</button><button class="btn ghost" onclick="newProj()">مشروع جديد</button></div>`;
}
function totalsHtml(C){return `<h3>الإجمالي</h3><div class="kpi">
  <div><small>عدد الشبابيك</small><b>${C.res.reduce((s,x)=>s+x.c.qty,0)}</b></div>
  <div><small>إجمالي الأمتار</small><b>${f2(C.area)} م²</b></div>
  <div><small>وزن الألومنيوم</small><b>${f2(C.weight)} كجم</b></div>
  <div><small>الإجمالي قبل الخصم</small><b>${f0(C.sum)} ج</b></div>
  <div style="background:#FFF6DC"><small>الصافي</small><b class="big">${f0(C.net)} ج</b></div></div>`}
function refreshTotals(){const el=$('#totals');if(el)el.innerHTML=totalsHtml(calcProject(DB.cur))}
function refreshCat(){DB.cur.cat=clone(DB.catalog);DB.cur.waste=DB.settings.waste;DB.cur.accWaste=DB.settings.accWaste;DB.cur.glassWaste=DB.settings.glassWaste;save();render();toast('تم تحديث الأسعار')}

/* ---- نموذج الشباك ---- */
let EW=null,EWi=-1;
function editWin(i){
  EWi=i; EW=i>=0?clone(DB.cur.windows[i]):{id:uid(),name:'',leaves:2,w:'',h:'',qty:1,mesh:true,track:false,fix:false,fixH:'',sasDir:'F',extra:0};
  drawWinForm(); $('#modal').classList.add('on');
}
function drawWinForm(){
  const w=EW, hasTrack=(DB.cur.cat.rules[w.leaves]||[]).some(r=>r.g==='track');
  const c=(+w.w&&+w.h)?calcWindow(w,DB.cur):null;
  $('#modalBody').innerHTML=`<h3>${EWi>=0?'تعديل شباك':'إضافة شباك'}</h3>
  <div class="grid">
   <div><label>اسم / مكان الشباك</label><input value="${esc(w.name)}" placeholder="مثال: صالة" oninput="EW.name=this.value"></div>
   <div><label>عدد الضلف</label><select onchange="EW.leaves=+this.value;EW.mesh=EW.leaves!==3;EW.track=false;drawWinForm()">${[2,3,4].map(n=>`<option value="${n}" ${w.leaves==n?'selected':''}>${n} ضلفة</option>`).join('')}</select></div>
   <div><label>العرض (متر)</label><input type="number" step="any" inputmode="decimal" value="${esc(w.w)}" oninput="EW.w=this.value;upd()"></div>
   <div><label>الارتفاع الكلي (متر)</label><input type="number" step="any" inputmode="decimal" value="${esc(w.h)}" oninput="EW.h=this.value;upd()"></div>
   <div><label>العدد</label><input type="number" min="1" value="${esc(w.qty)}" oninput="EW.qty=+this.value||1;upd()"></div>
   <div><label>إضافات (مقبض وغيره) جنيه</label><input type="number" step="any" value="${esc(w.extra)}" oninput="EW.extra=+this.value||0;upd()"></div>
  </div>
  <div style="margin:12px 0;display:grid;gap:8px">
   <label class="chk"><input type="checkbox" ${w.mesh?'checked':''} onchange="EW.mesh=this.checked;upd()"> ${w.leaves==3?'إضافة سلك (مجرى سلك + ضلف سلك)':'ضلف سلك'}</label>
   ${hasTrack?`<label class="chk"><input type="checkbox" ${w.track?'checked':''} onchange="EW.track=this.checked;upd()"> مجرى سلك إضافي M14610</label>`:''}
  </div>
  <details ${w.fix?'open':''}><summary>خيارات إضافية: جزء ثابت FIX</summary>
   <label class="chk" style="margin:6px 0"><input type="checkbox" ${w.fix?'checked':''} onchange="EW.fix=this.checked;drawWinForm()"> يوجد جزء ثابت (حلق فيكس على الثابت فقط)</label>
   ${w.fix?`<div class="grid"><div><label>ارتفاع الجزء الثابت (متر)</label><input type="number" step="any" value="${esc(w.fixH)}" oninput="EW.fixH=this.value;upd()"></div>
   <div><label>اتجاه السؤاس</label><select onchange="EW.sasDir=this.value;upd()"><option value="F" ${w.sasDir!=='W'?'selected':''}>بارتفاع الثابت</option><option value="W" ${w.sasDir==='W'?'selected':''}>بالعرض</option></select></div></div>
   <p class="hint">الجزء الجرار = الارتفاع الكلي − ارتفاع الثابت</p>`:''}
  </details>
  <div id="wprev" style="margin:10px 0">${c?prevHtml(c):''}</div>
  <div class="row"><button class="btn" onclick="saveWin()">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`;
}
function prevHtml(c){return `<div class="kpi"><div><small>سعر الشباك</small><b>${f0(c.unit)} ج</b></div><div><small>متوسط المتر</small><b>${f0(c.perM)} ج</b></div><div><small>الوزن</small><b>${f2(c.weight)} كجم</b></div></div>`}
function upd(){const el=$('#wprev');if(el)el.innerHTML=(+EW.w&&+EW.h)?prevHtml(calcWindow(EW,DB.cur)):''}
function saveWin(){
  if(!(+EW.w>0)||!(+EW.h>0)) return toast('اكتب العرض والارتفاع');
  if(EW.fix&&!(+EW.fixH>0&&+EW.fixH<+EW.h)) return toast('ارتفاع الثابت لازم يكون أقل من الارتفاع الكلي');
  if(+EW.w>20||+EW.h>20) return toast('المقاسات بالمتر (مثال 1.50)');
  if(EWi>=0) DB.cur.windows[EWi]=EW; else DB.cur.windows.push(EW);
  save(); closeModal(); render();
}
function closeModal(){$('#modal').classList.remove('on')}
function dupWin(i){const w=clone(DB.cur.windows[i]);w.id=uid();DB.cur.windows.splice(i+1,0,w);save();render()}
function delWin(i){askConfirm('حذف الشباك ده؟',()=>{DB.cur.windows.splice(i,1);save();render()})}
function askConfirm(msg,fn){$('#modalBody').innerHTML=`<h3>${msg}</h3><div class="row"><button class="btn red" id="okb">نعم</button><button class="btn ghost" onclick="closeModal()">لا</button></div>`;$('#modal').classList.add('on');$('#okb').onclick=()=>{closeModal();fn()}}

/* ---- التفاصيل ---- */
function cutTable(c,mult=1){
  let h='<div class="tw"><table><tr><th>القطعة</th><th>الكود</th><th>العدد</th><th>الطول سم</th><th>إجمالي الطول م</th><th>الوزن كجم</th></tr>';
  Object.keys(GROUPS).forEach(g=>{const rows=c.cuts.filter(x=>x.g===g);if(!rows.length)return;
    h+=`<tr class="grp"><td colspan="6">${GROUPS[g]}</td></tr>`;
    rows.forEach(x=>h+=`<tr><td>${esc(x.name)}</td><td class="num">${esc(x.code)}</td><td>${x.n*mult}</td><td class="num">${f2(x.len)}</td><td class="num">${f2(x.tot*mult/100)}</td><td class="num">${f2(x.kg*mult)}</td></tr>`)});
  h+=`<tr class="tot"><td colspan="5">الوزن الصافي${mult>1?' (× '+mult+')':''}</td><td class="num">${f2(c.raw*mult)}</td></tr></table></div>`;return h;
}
function accTable(c){
  let h='<div class="tw"><table><tr><th>الصنف</th><th>الكود</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>';
  Object.keys(GROUPS).forEach(g=>{const rows=c.accs.filter(x=>x.g===g);if(!rows.length)return;
    h+=`<tr class="grp"><td colspan="5">${GROUPS[g]}</td></tr>`;
    rows.forEach(x=>h+=`<tr><td>${esc(x.name)}</td><td class="num">${esc(x.code)}</td><td class="num">${f2(x.q)} ${x.unit==='m'?'م':x.unit==='m2'?'م²':''}</td><td class="num">${f2(x.price)}</td><td class="num">${f2(x.cost)}</td></tr>`)});
  h+=`<tr class="tot"><td colspan="4">الإجمالي + هالك ${DB.cur.accWaste}%</td><td class="num">${f2(c.accCost)}</td></tr></table></div>`;return h;
}
function costTable(c){const P=DB.cur;return `<div class="tw"><table>
 <tr><td>الألومنيوم (${f2(c.weight)} كجم شامل هالك ${P.waste}% × ${f2(P.kgPrice)})</td><td class="num">${f2(c.alu)}</td></tr>
 <tr><td>الإكسسوار</td><td class="num">${f2(c.accCost)}</td></tr>
 <tr><td>الزجاج ${esc(P.glassName)} (${f2(c.area)} م² × ${f2(P.glassPrice)} + ${P.glassWaste}%)</td><td class="num">${f2(c.glass)}</td></tr>
 <tr><td>الدهان (${f2(c.weight)} كجم × ${f2(P.paintRate)})</td><td class="num">${f2(c.paint)}</td></tr>
 ${c.extra?`<tr><td>إضافات</td><td class="num">${f2(c.extra)}</td></tr>`:''}
 <tr><td>المصنعية ${f2(P.laborPct)}%</td><td class="num">${f2(c.labor)}</td></tr>
 <tr class="tot"><td>سعر الشباك</td><td class="num">${f2(c.unit)}</td></tr>
 <tr><td>متوسط سعر المتر</td><td class="num">${f2(c.perM)}</td></tr>
 ${c.qty>1?`<tr class="tot"><td>الإجمالي × ${c.qty}</td><td class="num">${f2(c.total)}</td></tr>`:''}
 </table></div>`}
function vCalc(){
  const P=DB.cur; if(!P.windows.length) return '<div class="card">ضيف شبابيك الأول من صفحة المشروع.</div>';
  return P.windows.map((w,i)=>{const c=calcWindow(w,P);return `<div class="card"><h3>${esc(winTitle(w,i))}</h3>
   <div class="hint" style="margin-bottom:8px">${SYS_NAME} – ${winDesc(w)} – العدد ${c.qty} ${c.F?` – الجرار ${f2(c.H)} سم / الثابت ${f2(c.F)} سم`:''}</div>
   <details open><summary>القطاعات والتقطيع</summary>${cutTable(c)}</details>
   <details><summary>الإكسسوار</summary>${accTable(c)}</details>
   <details open><summary>التكلفة</summary>${costTable(c)}</details></div>`}).join('');
}

/* ---- كشف التقطيع المجمع ---- */
function aggregate(P){
  const by={};
  P.windows.forEach(w=>{const c=calcWindow(w,P);c.cuts.forEach(x=>{const k=x.code+'|'+x.name;const o=by[k]||(by[k]={name:x.name,code:x.code,w:x.w,pieces:{},tot:0,kg:0});
    o.pieces[x.len]=(o.pieces[x.len]||0)+x.n*c.qty;o.tot+=x.tot*c.qty;o.kg+=x.kg*c.qty;})});
  return Object.values(by);
}
function aggTable(P){
  const ag=aggregate(P), bar=+DB.settings.barLen||600, wf=1+(+P.waste||0)/100;
  let h='<div class="tw"><table><tr><th>القطاع</th><th>الكود</th><th>القطع (العدد × الطول سم)</th><th>إجمالي م</th><th>عيدان تقريبي</th><th>الوزن كجم</th></tr>';
  let tk=0; ag.forEach(o=>{tk+=o.kg;h+=`<tr><td>${esc(o.name)}</td><td class="num">${esc(o.code)}</td><td>${Object.entries(o.pieces).sort((a,b)=>b[0]-a[0]).map(([l,n])=>`<span class="num">${n}×${f2(+l)}</span>`).join(' ، ')}</td><td class="num">${f2(o.tot/100)}</td><td class="num">${Math.ceil(o.tot*wf/bar)}</td><td class="num">${f2(o.kg)}</td></tr>`});
  h+=`<tr class="tot"><td colspan="5">إجمالي الوزن الصافي / شامل هالك ${P.waste}%</td><td class="num">${f2(tk)} / ${f2(tk*wf)}</td></tr></table></div>`;return h;
}
function accAgg(P){const by={};P.windows.forEach(w=>{const c=calcWindow(w,P);c.accs.forEach(x=>{const k=x.code+'|'+x.name;const o=by[k]||(by[k]={name:x.name,code:x.code,unit:x.unit,q:0,cost:0});o.q+=x.q*c.qty;o.cost+=x.cost*c.qty})});return Object.values(by)}
function vCut(){
  const P=DB.cur; if(!P.windows.length) return '<div class="card">ضيف شبابيك الأول من صفحة المشروع.</div>';
  return `<div class="row" style="margin-bottom:12px"><button class="btn dark" onclick="printDoc('cut')">🖨️ طباعة / PDF</button><button class="btn ghost" onclick="exportCSV()">⬇️ تصدير Excel</button></div>
  <div class="card"><h3>إجمالي الخامات للمشروع</h3>${aggTable(P)}</div>
  <div class="card"><h3>إجمالي الإكسسوار</h3><div class="tw"><table><tr><th>الصنف</th><th>الكود</th><th>الكمية</th></tr>${accAgg(P).map(o=>`<tr><td>${esc(o.name)}</td><td class="num">${esc(o.code)}</td><td class="num">${f2(o.q)} ${o.unit==='m'?'م':o.unit==='m2'?'م²':''}</td></tr>`).join('')}</table></div></div>
  ${P.windows.map((w,i)=>{const c=calcWindow(w,P);return `<div class="card"><h3>${esc(winTitle(w,i))} – ${winDesc(w)} – العدد ${c.qty}</h3>${cutTable(c,c.qty)}</div>`}).join('')}`;
}

/* ---- عرض السعر ---- */
function vQuote(){
  const P=DB.cur; if(!P.windows.length) return '<div class="card">ضيف شبابيك الأول من صفحة المشروع.</div>';
  return `<div class="row" style="margin-bottom:12px"><button class="btn dark" onclick="printDoc('quote')">🖨️ طباعة عرض السعر / PDF</button><button class="btn ghost" onclick="printDoc('internal')">🖨️ طباعة التكلفة الداخلية</button></div>
  <div class="card" style="padding:0;overflow:hidden">${quoteDoc(P)}</div>`;
}
function docHead(title,P){const co=DB.settings.company;return `<div class="hd"><div><div class="brand">${esc(co.name).replace('SYSTEM','<b>SYSTEM</b>')}</div><div style="font-size:12px">${esc(co.tagline)}</div></div>
 <div class="meta"><b style="font-size:16px">${title}</b><br>${P.no?'رقم: '+esc(P.no)+'<br>':''}التاريخ: ${esc(P.date)}</div></div>`}
function quoteDoc(P){
  const C=calcProject(P),co=DB.settings.company;
  return `<div class="doc">${docHead('عرض سعر',P)}
  <div class="info"><div><b>السيد/ة:</b> ${esc(P.client)}</div><div><b>تليفون:</b> <span class="num">${esc(P.phone)}</span></div><div><b>العنوان:</b> ${esc(P.address)}</div><div><b>القطاع:</b> ${SYS_NAME}</div>
  ${P.color?`<div><b>اللون:</b> ${esc(P.color)}</div>`:''}${P.glassName?`<div><b>الزجاج:</b> ${esc(P.glassName)}</div>`:''}</div>
  <table><tr><th>م</th><th>البيان</th><th>المقاس (م)</th><th>العدد</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
  ${C.res.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(winTitle(x.win,i))}<br><span style="font-size:11px;color:#555">شباك جرار ${x.win.leaves} ضلفة${x.win.mesh?' + سلك':''}${x.win.fix?' + جزء ثابت':''}</span></td><td class="num">${f2(+x.win.w)} × ${f2(+x.win.h)}</td><td>${x.c.qty}</td><td class="num">${f0(x.c.unit)}</td><td class="num">${f0(x.c.total)}</td></tr>`).join('')}
  </table>
  <div class="totbox"><div><span>الإجمالي</span><span class="num">${f0(C.sum)} ج</span></div>${C.disc?`<div><span>خصم</span><span class="num">${f0(C.disc)} ج</span></div>`:''}<div class="g"><span>الصافي</span><span class="num">${f0(C.net)} ج</span></div></div>
  ${P.notes?`<p style="font-size:13px"><b>ملاحظات:</b> ${esc(P.notes)}</p>`:''}
  <div class="ft">${esc(co.terms).replace(/\n/g,'<br>')}<br>${co.phone?'📞 <span class="num">'+esc(co.phone)+'</span>':''} ${co.address?' – '+esc(co.address):''}</div></div>`;
}
function internalDoc(P){
  const C=calcProject(P);
  return `<div class="doc">${docHead('تكلفة داخلية – غير مخصص للعميل',P)}
   <div class="info"><div><b>العميل:</b> ${esc(P.client)}</div><div><b>سعر الكيلو:</b> ${f2(P.kgPrice)}</div><div><b>الزجاج:</b> ${esc(P.glassName)} – ${f2(P.glassPrice)}</div><div><b>المصنعية:</b> ${f2(P.laborPct)}%</div></div>
   ${C.res.map((x,i)=>`<div class="win-blk"><h2>${esc(winTitle(x.win,i))} – ${winDesc(x.win)} – العدد ${x.c.qty}</h2>${costTable(x.c)}</div>`).join('')}
   <div class="totbox"><div class="g"><span>الصافي</span><span class="num">${f0(C.net)} ج</span></div></div></div>`;
}
function cutDoc(P){
  return `<div class="doc">${docHead('كشف تقطيع',P)}<div class="info"><div><b>العميل:</b> ${esc(P.client)}</div><div><b>القطاع:</b> ${SYS_NAME}</div><div><b>اللون:</b> ${esc(P.color)}</div></div>
  <h2>إجمالي الخامات</h2>${aggTable(P)}
  ${P.windows.map((w,i)=>{const c=calcWindow(w,P);return `<div class="win-blk"><h2>${esc(winTitle(w,i))} – ${winDesc(w)} – العدد ${c.qty}</h2>${cutTable(c,c.qty)}</div>`}).join('')}</div>`;
}
function printDoc(kind){
  const P=DB.cur; $('#print').innerHTML=kind==='quote'?quoteDoc(P):kind==='cut'?cutDoc(P):internalDoc(P);
  const old=document.title; document.title=(kind==='quote'?'عرض سعر':kind==='cut'?'كشف تقطيع':'تكلفة')+' - '+(P.client||'')+' '+(P.no||'');
  setTimeout(()=>{try{window.print()}catch(e){toast('الطباعة غير متاحة هنا')} document.title=old},50);
}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){
  const P=DB.cur,rows=[['كشف تقطيع',SYS_NAME,P.client,P.date],[]];
  rows.push(['إجمالي الخامات']);rows.push(['القطاع','الكود','العدد','الطول سم','إجمالي م','الوزن كجم']);
  aggregate(P).forEach(o=>Object.entries(o.pieces).forEach(([l,n])=>rows.push([o.name,o.code,n,+l,r2(n*l/100),r2(o.w*n*l/100)])));
  rows.push([]);
  P.windows.forEach((w,i)=>{const c=calcWindow(w,P);rows.push([winTitle(w,i),winDesc(w),'العدد',c.qty]);rows.push(['القطعة','الكود','العدد','الطول سم','إجمالي م','الوزن كجم']);
    c.cuts.forEach(x=>rows.push([x.name,x.code,x.n*c.qty,x.len,r2(x.tot*c.qty/100),r2(x.kg*c.qty)]));
    rows.push(['الإكسسوار','الكود','الكمية']);c.accs.forEach(x=>rows.push([x.name,x.code,r2(x.q*c.qty)]));rows.push([])});
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('كشف-تقطيع-'+(P.client||'مشروع')+'.csv',csv,'text/csv;charset=utf-8');
}

/* ---- المحفوظات ---- */
function saveProject(){const P=DB.cur;if(!P.no){P.no='U-'+String(DB.seq++).padStart(4,'0')}P.saved=new Date().toISOString();
  const i=DB.projects.findIndex(x=>x.id===P.id); if(i>=0) DB.projects[i]=clone(P); else DB.projects.unshift(clone(P)); save(); render(); toast('تم الحفظ '+P.no)}
function newProj(){askConfirm('فتح مشروع جديد؟ (احفظ الحالي الأول لو محتاجه)',()=>{DB.cur=newProject();save();VIEW='proj';render()})}
function openProj(id){const p=DB.projects.find(x=>x.id===id);if(p){DB.cur=clone(p);save();VIEW='proj';render()}}
function copyProj(id){const p=clone(DB.projects.find(x=>x.id===id));p.id=uid();p.no='';p.date=today();DB.cur=p;save();VIEW='proj';render();toast('نسخة جديدة – عدّل واحفظ')}
function delProj(id){askConfirm('حذف المشروع نهائياً؟',()=>{DB.projects=DB.projects.filter(x=>x.id!==id);save();render()})}
let QS='';
function vSaved(){
  const list=DB.projects.filter(p=>!QS||(p.client+p.no+p.phone).includes(QS));
  return `<div class="card"><h3>المشروعات المحفوظة <span class="pill">${DB.projects.length}</span></h3>
  <input placeholder="بحث بالاسم أو الرقم أو التليفون" value="${esc(QS)}" oninput="QS=this.value;const p=this.selectionStart;render();const i=document.querySelector('#app input');i.focus();i.setSelectionRange(p,p)" style="margin-bottom:10px">
  ${list.map(p=>{const C=calcProject(p);return `<div class="win"><div><div class="t">${esc(p.no)} – ${esc(p.client||'بدون اسم')}</div><div class="d">${esc(p.date)} – ${p.windows.length} شباك – <span class="num">${esc(p.phone)}</span></div></div>
   <div class="row"><span class="price">${f0(C.net)} ج</span><button class="btn sm" onclick="openProj('${p.id}')">فتح</button><button class="btn ghost sm" onclick="copyProj('${p.id}')">نسخ</button><button class="btn red sm" onclick="delProj('${p.id}')">حذف</button></div></div>`}).join('')||'<p class="hint">مفيش مشروعات محفوظة.</p>'}</div>
  <div class="card"><h3>نسخة احتياطية</h3><p class="hint">البيانات محفوظة على الجهاز ده بس. خد نسخة احتياطية كل فترة، وتقدر ترجّعها على أي جهاز.</p>
   <div class="row"><button class="btn dark" onclick="backup()">⬇️ تنزيل نسخة احتياطية</button><label class="btn ghost" style="margin:0">⬆️ استرجاع نسخة<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div></div>`;
}
function backup(){download('ultra14600-backup-'+today()+'.json',JSON.stringify(DB),'application/json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.catalog||!d.projects)throw 0;askConfirm('استبدال كل البيانات الحالية بالنسخة دي؟',()=>{DB=d;load2();save();render();toast('تم الاسترجاع')})}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function load2(){DB.settings=Object.assign(clone(DEF_SETTINGS),DB.settings||{});if(!DB.cur)DB.cur=newProject()}

/* ---- الإعدادات ---- */
let ST='acc', SL=2;
function setS(path,v){const k=path.split('.');let o=DB.settings;while(k.length>1)o=o[k.shift()];o[k[0]]=v;save()}
function setCat(list,i,k,v){DB.catalog[list][i][k]=v;save()}
function vSettings(){
  const s=DB.settings,cat=DB.catalog;
  const tabs=`<div class="row" style="margin-bottom:12px">${[['acc','أسعار الإكسسوار'],['prof','القطاعات والأوزان'],['qty','الكميات لكل نوع'],['gen','الإعدادات العامة']].map(([k,t])=>`<button class="btn ${ST===k?'':'ghost'} sm" onclick="ST='${k}';render()">${t}</button>`).join('')}</div>
  <p class="hint">أي تعديل هنا بيتحفظ فوراً ويطبق على المشروعات الجديدة. للمشروع المفتوح اضغط "تحديث المشروع بأسعار القائمة الحالية" في صفحة المشروع.</p>`;
  let body='';
  if(ST==='acc'){
    body=`<div class="card"><h3>أسعار الإكسسوار</h3><div class="tw"><table><tr><th>الصنف</th><th>الكود</th><th>الوحدة</th><th>السعر</th></tr>
    ${cat.acc.map((a,i)=>`<tr><td><input value="${esc(a.name)}" oninput="setCat('acc',${i},'name',this.value)"></td><td><input class="num" value="${esc(a.code)}" oninput="setCat('acc',${i},'code',this.value)"></td><td>${a.unit==='m'?'متر':a.unit==='m2'?'متر²':'قطعة'}</td><td><input type="number" step="any" class="num" value="${r2(a.price)}" oninput="setCat('acc',${i},'price',+this.value)"></td></tr>`).join('')}
    </table></div>
    <details style="margin-top:10px"><summary>+ إضافة صنف جديد</summary><div class="grid"><div><label>الاسم</label><input id="na_n"></div><div><label>الكود</label><input id="na_c"></div><div><label>الوحدة</label><select id="na_u"><option value="pc">قطعة</option><option value="m">متر</option><option value="m2">متر²</option></select></div><div><label>السعر</label><input id="na_p" type="number" step="any"></div></div>
    <p class="hint">بعد الإضافة حدد كميته من تبويب "الكميات لكل نوع".</p><button class="btn sm" onclick="addAcc()">إضافة</button></details></div>`;
  } else if(ST==='prof'){
    body=`<div class="card"><h3>القطاعات والأوزان (كجم/متر)</h3><div class="tw"><table><tr><th>القطاع</th><th>الكود</th><th>وزن المتر</th></tr>
    ${cat.profiles.map((p,i)=>`<tr><td><input value="${esc(p.name)}" oninput="setCat('profiles',${i},'name',this.value)"></td><td><input class="num" value="${esc(p.code)}" oninput="setCat('profiles',${i},'code',this.value)"></td><td><input type="number" step="any" class="num" value="${p.w}" oninput="setCat('profiles',${i},'w',+this.value)"></td></tr>`).join('')}
    </table></div></div>`;
  } else if(ST==='qty'){
    const rules=cat.rules[SL], ar=cat.accRules[SL];
    const pOpt=sel=>cat.profiles.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} ${esc(p.code)}</option>`).join('');
    const lOpt=sel=>Object.entries(LEN_OPTS).map(([k,t])=>`<option value="${k}" ${k===sel?'selected':''}>${t}</option>`).join('');
    const nm=id=>{const a=cat.acc.find(x=>x.id===id);return a?esc(a.name)+' <span class="hint num">'+esc(a.code)+'</span>':'?'};
    const accRow=(r,i,key)=>{let q;
      if(r.n!=null) q=`<input type="number" step="any" value="${r.n}" oninput="setRule('${key}',${i},'n',+this.value)" style="width:80px"> قطعة`;
      else if(r.kwh!=null) q=`<input type="number" step="any" value="${r.kwh}" oninput="setRule('${key}',${i},'kwh',+this.value)" style="width:80px"> × العرض × الارتفاع`;
      else if(r.perim) q=`<input type="number" step="any" value="${r.perim}" oninput="setRule('${key}',${i},'perim',+this.value)" style="width:70px"> × محيط حلق الفيكس`;
      else q=`<input type="number" step="any" value="${r.kw}" oninput="setRule('${key}',${i},'kw',+this.value)" style="width:65px"> × العرض + <input type="number" step="any" value="${r.kh}" oninput="setRule('${key}',${i},'kh',+this.value)" style="width:65px"> × الارتفاع`;
      return `<tr><td>${GROUPS[r.g]}</td><td>${nm(r.a)}</td><td><div class="row" style="flex-wrap:nowrap">${q}</div></td></tr>`};
    body=`<div class="row" style="margin-bottom:10px">${[2,3,4,'fix'].map(n=>`<button class="btn ${SL==n?'dark':'ghost'} sm" onclick="SL=${n==='fix'?"'fix'":n};render()">${n==='fix'?'الجزء الثابت':n+' ضلفة'}</button>`).join('')}</div>
    <div class="card"><h3>القطاعات – ${SL==='fix'?'الجزء الثابت':SL+' ضلفة'}</h3><div class="tw"><table><tr><th>المجموعة</th><th>القطاع</th><th>الطول</th><th>العدد</th><th></th></tr>
    ${rules.map((r,i)=>`<tr><td><select onchange="setRule('p',${i},'g',this.value)">${Object.entries(GROUPS).filter(([k])=>SL==='fix'?k==='fix':k!=='fix').map(([k,t])=>`<option value="${k}" ${k===r.g?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><select onchange="setRule('p',${i},'p',this.value)">${pOpt(r.p)}</select></td><td><select onchange="setRule('p',${i},'len',this.value)">${lOpt(r.len)}</select></td>
      <td><input type="number" step="any" value="${r.n}" style="width:70px" oninput="setRule('p',${i},'n',+this.value)"></td><td><button class="btn red sm" onclick="delRule(${i})">✕</button></td></tr>`).join('')}
    </table></div><button class="btn ghost sm" style="margin-top:8px" onclick="addRule()">+ إضافة سطر قطاع</button></div>
    <div class="card"><h3>الإكسسوار – ${SL==='fix'?'الجزء الثابت':SL+' ضلفة'}</h3><p class="hint">العرض والارتفاع هنا بالمتر، والارتفاع = ارتفاع الجزء الجرار.</p><div class="tw"><table><tr><th>المجموعة</th><th>الصنف</th><th>الكمية</th></tr>
    ${ar.map((r,i)=>accRow(r,i,'a')).join('')}</table></div>
    <details style="margin-top:8px"><summary>+ إضافة صنف لهذا النوع</summary><div class="grid">
     <div><label>الصنف</label><select id="ar_a">${cat.acc.map(a=>`<option value="${a.id}">${esc(a.name)} ${esc(a.code)}</option>`).join('')}</select></div>
     <div><label>المجموعة</label><select id="ar_g">${Object.entries(GROUPS).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>
     <div><label>العدد (للقطعة) أو معامل</label><input id="ar_n" type="number" step="any" value="1"></div></div>
     <p class="hint">لو الصنف بالمتر هيتحسب = المعامل × العرض، وعدّل المعامل بعد الإضافة.</p><button class="btn sm" onclick="addAccRule()">إضافة</button></details>
    </div>
    <div class="row"><button class="btn red sm" onclick="resetCat()">استرجاع القيم الأصلية من ملف Excel</button></div>`;
  } else {
    const n=(l,p,step='any')=>`<div><label>${l}</label><input type="number" step="${step}" value="${esc(p.split('.').reduce((o,k)=>o[k],s))}" oninput="setS('${p}',+this.value)"></div>`;
    const t=(l,p)=>`<div><label>${l}</label><input value="${esc(p.split('.').reduce((o,k)=>o[k],s))}" oninput="setS('${p}',this.value)"></div>`;
    body=`<div class="card"><h3>القيم الافتراضية للمشروع الجديد</h3><div class="grid">${n('سعر كيلو الألومنيوم','kgPrice')}${n('سعر الدهان / كيلو','paintRate')}${n('المصنعية %','laborPct')}${n('سعر متر الزجاج','glassPrice')}${t('مسمى الزجاج','glassName')}</div></div>
    <div class="card"><h3>الهالك</h3><div class="grid">${n('هالك الألومنيوم %','waste')}${n('هالك الإكسسوار %','accWaste')}${n('هالك الزجاج %','glassWaste')}${n('طول العود (سم) لحساب العيدان','barLen')}</div></div>
    <div class="card"><h3>بيانات الشركة في عرض السعر</h3><div class="grid">${t('اسم الشركة','company.name')}${t('الوصف','company.tagline')}${t('التليفون','company.phone')}${t('العنوان','company.address')}</div>
    <label style="margin-top:8px">الشروط أسفل عرض السعر</label><textarea rows="3" oninput="setS('company.terms',this.value)">${esc(s.company.terms)}</textarea></div>`;
  }
  return tabs+body;
}
function ruleList(key){return key==='p'?DB.catalog.rules[SL]:DB.catalog.accRules[SL]}
function setRule(key,i,k,v){ruleList(key)[i][k]=v;save()}
function delRule(i){DB.catalog.rules[SL].splice(i,1);save();render()}
function addRule(){DB.catalog.rules[SL].push({g:SL==='fix'?'fix':'base',p:'p1',len:'W',n:1});save();render()}
function addAcc(){const n=$('#na_n').value.trim();if(!n)return toast('اكتب اسم الصنف');DB.catalog.acc.push({id:'x'+uid(),name:n,code:$('#na_c').value.trim(),unit:$('#na_u').value,price:+$('#na_p').value||0});save();render();toast('تمت الإضافة')}
function addAccRule(){const a=$('#ar_a').value,acc=DB.catalog.acc.find(x=>x.id===a),v=+$('#ar_n').value||0,g=$('#ar_g').value;
  const r={g,a}; if(acc.unit==='pc') r.n=v; else if(acc.unit==='m2') r.kwh=v; else {r.kw=v;r.kh=0}
  DB.catalog.accRules[SL].push(r);save();render();toast('تمت الإضافة')}
function resetCat(){askConfirm('استرجاع كل القطاعات والأسعار والكميات للقيم الأصلية؟',()=>{DB.catalog=freshCatalog();save();render();toast('تم الاسترجاع')})}

load(); render();
</script>
</body>
</html>
